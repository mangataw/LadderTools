;设置分组标志位
;!!GROUP 根据 url= 中的 tag 筛选订阅来源；!! 后的第二个条件继续筛选节点名称。
custom_proxy_group=节点选择`select`[]自动选择-def`[]自动选择-prem`[]自动选择-bud`[]香港节点`[]日本节点`[]台湾节点`[]美国节点`[]狮城节点`[]手动切换节点`[]手动切换分组`[]DIRECT
custom_proxy_group=手动切换节点`select`^((?!(剩余|流量|到期|套餐|官网|更新|重置)).)*$
custom_proxy_group=手动切换分组`select`[]香港节点`[]香港节点-bud`[]日本节点`[]日本节点-prem`[]美国节点`[]美国节点-prem`[]自动选择-prem`[]自动选择-bud`[]台湾节点`[]狮城节点`[]韩国节点`[]澳洲节点`[]德国节点`[]荷兰节点`[]英国节点`[]爱沙节点`[]DIRECT

