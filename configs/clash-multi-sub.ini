[custom]
;LadderTools 多订阅 Clash subconverter 转换模板
;本文件用于 subconverter 的 config= 参数，可生成 OpenClash、Clash Verge Rev 或 Stash 配置。
;订阅地址仅通过转换请求的 url= 参数传入，不应写入本文件。
;
;三个订阅必须分别使用以下固定 tag，随后用 | 连接，并对整个 url 参数进行 URL 编码：
;tag:default,<DEFAULT_URL>|tag:premium,<PREMIUM_URL>|tag:budget,<BUDGET_URL>
;
;通用请求结构：
;https://<subconverter>/sub?target=clash&url=<ENCODED_TAGGED_URLS>&config=<ENCODED_CONFIG_URL>&new_name=true
;OpenClash 展开全部规则：追加 expand=true
;Stash 使用规则集：追加 expand=false&classic=true
;
;策略组与命名沿用 LadderTools 多订阅方案。
;subconverter INI 分组语法不能直接输出 Mihomo 的 hidden 和 empty-fallback 属性。
enable_rule_generator=true
overwrite_original_rules=true

;设置规则标志位
;格式：ruleset=策略组,[类型:]规则地址[,更新间隔秒]
;明确的纯域名/IP集合使用 clash-domain/clash-ipcidr。
;未明确或包含多种 Clash 规则的集合使用兼容的 clash-classic。
;86400 仅在 expand=false 生成 rule-provider 时作为规则集更新间隔。

;个人自定义分组规则
ruleset=全球直连,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_direct.list,86400
ruleset=AI,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_ai.list,86400
ruleset=美国节点,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_us.list,86400
ruleset=日本节点,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_japan.list,86400
ruleset=非日节点,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_japan_not.list,86400
ruleset=节点选择,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy.list,86400

;默认需要代理，可能需要手动调整分组
