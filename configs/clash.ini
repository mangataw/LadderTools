[custom]
;LadderTools 通用 Clash 订阅转换模板
;本文件用于 subconverter 的 config= 参数，可同时生成 OpenClash 和 Stash 配置。
;订阅地址应通过转换请求的 url= 参数传入，不应写入本文件。
;OpenClash 展开全部规则：target=clash&expand=true&new_name=true
;Stash 使用规则集：target=clash&expand=false&classic=true&new_name=true
enable_rule_generator=true
overwrite_original_rules=true

;设置规则标志位
;格式：ruleset=策略组,[类型:]规则地址[,更新间隔秒]
;明确的纯域名/IP集合使用 clash-domain/clash-ipcidr。
;未明确或包含多种 Clash 规则的集合使用兼容的 clash-classic。
;86400 仅在 expand=false 生成 rule-provider 时作为规则集更新间隔。
;个人自定义分组规则
ruleset=全球直连,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_direct.list,86400
ruleset=AI,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_ai.list,86400
ruleset=美国节点,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_us.list,86400
ruleset=日本节点,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_japan.list,86400
ruleset=非日节点,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_japan_not.list,86400
ruleset=节点选择,clash-classic:https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy.list,86400
;默认需要代理，可能需要手动调整分组
;ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
;RULE-SET,AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Claude/Claude.list,AI
;RULE-SET,AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Copilot/Copilot.list,AI
ruleset=AI,clash-classic:https://raw.githubusercontent.com/iab0x00/ProxyRules/main/Rule/AI.txt,86400
ruleset=谷歌服务,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list,86400
