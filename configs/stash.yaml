# LadderTools Stash 配置
# 基于 configs/openclash.ini 转换。
# 此公开配置不保存私人订阅地址。
# 请在 Stash 中另外启用本地私有覆写文件，参考 stash-private.example.stoverride。
# subscription provider 也可指向自建转换服务；返回内容必须包含顶层 proxies 字段。
# 规则集和代理分组的引用顺序与 openclash.ini 保持一致，请勿随意调整。

mode: rule
log-level: info

# 代理提供器仅声明公开参数和本地缓存路径。
# 私人 URL 通过同名 subscription provider 的本地覆写递归合并。
proxy-providers:
  subscription:
    # Stash 管理的 provider 缓存位置；未注入 URL 时只会读取已有本地缓存。
    path: ./providers/subscription.yaml
    # 注入 URL 后，每小时检查一次代理集更新。
    interval: 3600
    benchmark-url: https://www.gstatic.com/generate_204
    benchmark-timeout: 5

proxy-groups:
  # 主选择、手动选择和全节点自动测速组。
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 香港节点
      - 日本节点
      - 台湾节点
      - 美国节点
      - 狮城节点
      - 手动切换节点
      - 手动切换分组
      - DIRECT

  - name: 手动切换节点
    type: select
    use:
      - subscription

  - name: 手动切换分组
    type: select
    proxies:
      - 香港节点
      - 日本节点
      - 美国节点
      - 台湾节点
      - 狮城节点
      - 韩国节点
      - 澳洲节点
      - 德国节点
      - 荷兰节点
      - 英国节点
      - 爱沙节点
      - DIRECT

  - name: 自动选择
    type: url-test
    use:
      - subscription
    interval: 600

  # 地区测速组通过节点名称正则实时筛选 subscription provider。
  - name: 香港节点
    type: url-test
    use:
      - subscription
    filter: '香港|港|HK|Hong Kong|HongKong'
    interval: 600

  - name: 日本节点
    type: url-test
    use:
      - subscription
    filter: '日本|东京|大阪|埼玉|JP|Japan'
    interval: 600

  - name: 美国节点
    type: url-test
    use:
      - subscription
    filter: '美国|美西|美东|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|USA|United States'
    interval: 600

  - name: 台湾节点
    type: url-test
    use:
      - subscription
    filter: '台湾|台北|新北|彰化|TW|Taiwan'
    interval: 600

  - name: 狮城节点
    type: url-test
    use:
      - subscription
    filter: '新加坡|狮城|SG|Singapore'
    interval: 600

  - name: 韩国节点
    type: url-test
    use:
      - subscription
    filter: '韩国|首尔|KR|Korea|KOR|韓國'
    interval: 600

  - name: 澳洲节点
    type: url-test
    use:
      - subscription
    filter: '澳大利亚|澳洲|AU|Australia|AUS'
    interval: 600

  - name: 德国节点
    type: url-test
    use:
      - subscription
    filter: '德国|DE|Germany|Deutschland|GER'
    interval: 600

  - name: 荷兰节点
    type: url-test
    use:
      - subscription
    filter: '荷兰|NL|Netherlands|Holland'
    interval: 600

  - name: 英国节点
    type: url-test
    use:
      - subscription
    filter: '英国|UK|England|GB|GBR'
    interval: 600

  - name: 爱沙节点
    type: url-test
    use:
      - subscription
    filter: '爱沙尼亚|EE|Estonia|EST'
    interval: 600

  - name: 非日节点
    type: url-test
    use:
      - subscription
    filter: '^(?!.*(日本|东京|大阪|埼玉|JP|Japan|jp|japan)).*$'
    interval: 600

  # 默认代理服务与媒体策略组。
  - name: AI
    type: select
    proxies:
      - 日本节点
      - 美国节点
      - 狮城节点
      - 澳洲节点
      - 德国节点

  - name: 电报消息
    type: select
    proxies:
      - 香港节点
      - 节点选择
      - 狮城节点
      - 台湾节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - 手动切换分组
      - DIRECT

  - name: 游戏平台
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 节点选择
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 韩国节点
      - 手动切换分组
      - DIRECT

  - name: 油管视频
    type: select
    proxies:
      - 节点选择
      - 狮城节点
      - 香港节点
      - 台湾节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - 手动切换分组
      - DIRECT

  - name: 奈飞节点
    type: select
    use:
      - subscription
    filter: 'NF|奈飞|解锁|Netflix|NETFLIX|Media'

  - name: 奈飞视频
    type: select
    proxies:
      - 奈飞节点
      - 节点选择
      - 狮城节点
      - 香港节点
      - 台湾节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - 手动切换分组
      - DIRECT

  - name: 巴哈姆特
    type: select
    proxies:
      - 台湾节点
      - 节点选择
      - 手动切换分组
      - DIRECT

  - name: 国外媒体
    type: select
    proxies:
      - 节点选择
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - 手动切换分组
      - DIRECT

  # 默认直连优先的系统服务策略组。
  - name: 谷歌FCM
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
      - 手动切换分组

  - name: 微软云盘
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
      - 手动切换分组

  - name: 微软服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
      - 手动切换分组

  - name: 苹果服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 美国节点
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
      - 手动切换分组

  # 国内服务与直连策略组。
  - name: 网易音乐
    type: select
    proxies:
      - DIRECT
      - 节点选择
    use:
      - subscription
    filter: '网易|音乐|解锁|Music|NetEase'

  - name: 哔哩哔哩
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 台湾节点
      - 香港节点
      - 手动切换分组

  - name: 国内媒体
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 手动切换分组

  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 手动切换分组

  # 拦截及最终兜底策略组。
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 漏网之鱼
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - 手动切换分组

# Stash 推荐将内容明确的纯域名/IP集合声明为 domain/ipcidr。
# 未明确或包含多种 Clash 规则的集合使用兼容性更高的 classical。
# 所有远程规则文件均为逐行文本格式，因此统一声明 format: text。
rule-providers:
  custom-direct:
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/mangataw/LadderTools/main/rules/proxy_direct.list
    path: ./rules/custom-direct.list
    interval: 86400

