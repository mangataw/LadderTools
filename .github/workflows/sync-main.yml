name: Sync main from dev

on:
  push:
    branches:
      - dev
    paths:
      - "rules/**"
      - "providers/**"
      - "scripts/**"
      - "configs/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/sync-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-sync:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate rules
        run: python scripts/validate_rules.py

      - name: Export providers
        run: python scripts/export_providers.py

      - name: Ensure generated files are up to date
        run: git diff --exit-code

      - name: Fetch main branch
        run: git fetch origin main

      - name: Check whether sync is needed
        id: sync_check
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main && \
             [ "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync current commit to main
        if: steps.sync_check.outputs.should_sync == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main
